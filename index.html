    <div id="main">
      <h2>とにかく古今東西のスーパー正男サイトを集めてみるページ</h2>

      <!--<p>メジャーなものからマイナーなもの、活動中のものから懐かしいものまで</p>-->
      <p>スーパー正男の過去、現在、そして未来</p>

      <p><a href="setsumei.html">このページについて</a></p>

      <p><a href="exception-sitelist.html">例外リスト一覧</a></p>

      <div class="filter">
        先頭文字の行で絞り込む
        <form id="form-order">
          <input
            type="radio"
            name="radio-order"
            value="all"
            id="all"
            onclick="clickRadio()"
            checked
          /><label for="all">すべての行</label>
          <input
            type="radio"
            name="radio-order"
            value="a"
            id="a"
            onclick="clickRadio()"
          /><label for="a">あ行</label>
          <input
            type="radio"
            name="radio-order"
            value="k"
            id="k"
            onclick="clickRadio()"
          /><label for="k">か行</label>
          <input
            type="radio"
            name="radio-order"
            value="s"
            id="s"
            onclick="clickRadio()"
          /><label for="s">さ行</label>
          <input
            type="radio"
            name="radio-order"
            value="t"
            id="t"
            onclick="clickRadio()"
          /><label for="t">た行</label>
          <input
            type="radio"
            name="radio-order"
            value="n"
            id="n"
            onclick="clickRadio()"
          /><label for="n">な行</label>
          <input
            type="radio"
            name="radio-order"
            value="h"
            id="h"
            onclick="clickRadio()"
          /><label for="h">は行</label>
          <input
            type="radio"
            name="radio-order"
            value="m"
            id="m"
            onclick="clickRadio()"
          /><label for="m">ま行</label>
          <input
            type="radio"
            name="radio-order"
            value="y"
            id="y"
            onclick="clickRadio()"
          /><label for="y">や行</label>
          <input
            type="radio"
            name="radio-order"
            value="r"
            id="r"
            onclick="clickRadio()"
          /><label for="r">ら行</label>
          <input
            type="radio"
            name="radio-order"
            value="w"
            id="w"
            onclick="clickRadio()"
          /><label for="w">わ行</label>
        </form>
      </div>

      <div class="filter">
        サイトの状態で絞り込む
        <form id="form-mode">
          <input
            type="radio"
            name="radio-mode"
            value="all"
            id="all-site"
            onclick="clickRadio()"
            checked
          /><label for="all-site">すべて</label>
          <input
            type="radio"
            name="radio-mode"
            value="now"
            id="now-site"
            onclick="clickRadio()"
          /><label for="now-site">現存サイトのみ</label>
          <input
            type="radio"
            name="radio-mode"
            value="canvas"
            id="canvas-site"
            onclick="clickRadio()"
          /><label for="canvas-site">Canvas対応サイトのみ</label>
          <input
            type="radio"
            name="radio-mode"
            value="archive"
            id="archive-site"
            onclick="clickRadio()"
          /><label for="archive-site">アーカイブに正男保存のサイトのみ</label>
        </form>
      </div>

      <div class="filter">
        正男の種別で絞り込む
        <form id="form-masao-kind">
          <input
            type="radio"
            name="radio-masao-kind"
            value="all"
            id="masao-kind-all"
            onclick="clickRadio()"
            checked
          /><label for="masao-kind-all">すべて</label>
          <!-- ほかのボタンは js/kokon.js が common.js の値から作る -->
        </form>
      </div>

      <div class="filter">
        サイトの特徴で絞り込む
        <form id="form-feature">
          <input
            type="radio"
            name="radio-feature"
            value="all"
            id="feature-all"
            onclick="clickRadio()"
            checked
          /><label for="feature-all">すべて</label>
          <!-- ほかのボタンは js/kokon.js が common.js の値から作る -->
        </form>
      </div>

      <div class="scroll_top"><p>左右にスクロールできます</p></div>
      <div class="scroll">
        <div id="kokon">
          <table>
            <thead>
              <tr>
                <th>バナー</th>
                <th>サイト名</th>
                <th>管理人</th>
                <th>期間</th>
              </tr>
            </thead>
            <tbody id="kokon-nakami"></tbody>
          </table>
        </div>
      </div>
